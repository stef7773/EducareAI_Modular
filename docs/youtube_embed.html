<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Educare AI - YouTube Embed</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }
  #player {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
  <div id="player"></div>
  <script>
    function getParam(name) {
      var params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    var videoId = getParam('v') || '';
    var shouldAutoplay = getParam('autoplay') === '1' ? 1 : 0;

    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: videoId,
        playerVars: {
          controls: 1,
          disablekb: 0,
          fs: 1,
          modestbranding: 1,
          playsinline: 1,
          rel: 0,
          autoplay: shouldAutoplay,
          iv_load_policy: 3
        },
        events: {
          onReady: function (e) {
            if (shouldAutoplay) {
              e.target.playVideo();
            }
            if (window.AndroidPlayerBridge) {
              AndroidPlayerBridge.onReady();
            }
          },
          onStateChange: function (e) {
            if (window.AndroidPlayerBridge) {
              AndroidPlayerBridge.onStateChange(e.data);
            }
          },
          onError: function (e) {
            if (window.AndroidPlayerBridge) {
              AndroidPlayerBridge.onPlayerError(e.data);
            }
          }
        }
      });
    }

    // Llamada desde Android (evaluateJavascript) para alternar play/pausa
    function togglePlayPause() {
      if (!player || typeof player.getPlayerState !== 'function') return;
      var state = player.getPlayerState();
      if (state === 1) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    }
  </script>
</body>
</html>
